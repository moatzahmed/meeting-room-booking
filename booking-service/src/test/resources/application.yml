spring:
  application:
    name: booking-service-test
  cloud:
    config:
      enabled: false
    bus:
      enabled: false

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,bulkheads,bulkheadevents,circuitbreakers,circuitbreakerevents,retries,retryevents

clients:
  room-service:
    base-url: http://localhost
    discovery-enabled: false
    connect-timeout: 200ms
    read-timeout: 100ms

resilience4j:
  bulkhead:
    bulkhead-aspect-order: 0
    instances:
      roomService:
        maxConcurrentCalls: 10
        maxWaitDuration: 0
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      roomService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.learning.meetingrooms.booking.application.RoomServiceUnavailableException
  retry:
    retry-aspect-order: 2
    instances:
      roomService:
        maxAttempts: 2
        waitDuration: 100ms
        retryExceptions:
          - com.learning.meetingrooms.booking.application.RoomServiceUnavailableException
